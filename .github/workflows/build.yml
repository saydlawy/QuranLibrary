name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Fix android-37 SDK naming
        run: ln -sf $ANDROID_SDK_ROOT/platforms/android-37.0 $ANDROID_SDK_ROOT/platforms/android-37 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify baseline environment
        run: |
          echo "CI_COMMIT=$(git rev-parse HEAD)"
          java -version
          python --version
          ./gradlew --version

      - name: Unit test task
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release upload dev-latest app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create dev-latest \
              --title "Development Build" \
              --notes "Latest build from main branch" \
              --prerelease \
              app/build/outputs/apk/debug/app-debug.apk
          fi
